<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>SIKAMI</title>
    <meta name="description" content="SIKAMI — Sistem Informasi Kegiatan dan Mitra, BPS Kabupaten Bengkulu Selatan" />
    <!--
      Dirujuk eksplisit: tanpa tag ini peramban mencari /favicon.ico di akar
      domain, padahal di produksi aplikasi berada di /kharisma/. Vite menambahkan
      base path itu sendiri saat build.
    -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />

    <!--
      Mencegah kedip putih saat memuat halaman dalam mode gelap.
      Zustand memang hydrate secara sinkron, tapi peramban sudah mengecat latar
      dokumen sebelum bundle React selesai diunduh — di jaringan lambat kedipnya
      sangat terasa. Karena itu skrip ini harus berada SEBELUM bundle.

      Kunci 'sidebar-storage' dan jalur .state.theme mengikuti envelope
      zustand/persist dan harus sama persis dengan client/stores/useSidebarStore.ts.
      Kalau nama penyimpanannya diganti, skrip ini berhenti bekerja diam-diam.
    -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('sidebar-storage');
          var theme = raw && (JSON.parse(raw).state || {}).theme;
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {
          /* localStorage diblokir -> jatuh ke mode terang */
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/client/App.tsx"></script>
  </body>
</html>
