<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="668px" preserveAspectRatio="none" style="width:625px;height:668px;background:#FFFFFF;" version="1.1" viewBox="0 0 625 668" width="625px" zoomAndPan="magnify"><defs/><g><!--cluster Pengelolaan Mitra Statistik di BPS Kabupaten Bengkulu Selatan--><g id="cluster_Pengelolaan Mitra Statistik di BPS Kabupaten Bengkulu Selatan"><rect fill="none" height="655.5" rx="5" ry="5" style="stroke:#777777;stroke-width:1.0;" width="374" x="7" y="7"/><text fill="#000000" font-family="Arial" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="358" x="15" y="20.2559">Pengelolaan Mitra Statistik di BPS Kabupaten Bengkulu Selatan</text></g><!--entity L1--><g id="elem_L1"><rect fill="#F1F1F1" height="47.5977" rx="5" ry="5" style="stroke:#555555;stroke-width:0.5;" width="162" x="203" y="39"/><text fill="#000000" font-family="Arial" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="142" x="213" y="60.2559">1. Perencanaan Kegiatan</text><text fill="#000000" font-family="Arial" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="117" x="213" y="74.0547">dan Kebutuhan Mitra</text></g><!--entity L2--><g id="elem_L2"><rect fill="#F1F1F1" height="47.5977" rx="5" ry="5" style="stroke:#555555;stroke-width:0.5;" width="132" x="221" y="147"/><text fill="#000000" font-family="Arial" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="106" x="231" y="168.2559">2. Penentuan Mitra</text><text fill="#000000" font-family="Arial" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="112" x="231" y="182.0547">dan PML Pengawas</text></g><!--entity L3--><g id="elem_L3"><rect fill="#F1F1F1" height="47.5977" rx="5" ry="5" style="stroke:#555555;stroke-width:0.5;" width="142" x="216" y="255"/><text fill="#000000" font-family="Arial" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="110" x="226" y="276.2559">3. Penyusunan SPK</text><text fill="#000000" font-family="Arial" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="122" x="226" y="290.0547">dan Penetapan Honor</text></g><!--entity L4--><g id="elem_L4"><rect fill="#F1F1F1" height="47.5977" rx="5" ry="5" style="stroke:#555555;stroke-width:0.5;" width="166" x="198" y="369.5"/><text fill="#000000" font-family="Arial" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="146" x="208" y="390.7559">4. Pelaksanaan Lapangan</text><text fill="#000000" font-family="Arial" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="145" x="208" y="404.5547">dan Pemantauan Progres</text></g><!--entity L5--><g id="elem_L5"><rect fill="#F1F1F1" height="47.5977" rx="5" ry="5" style="stroke:#555555;stroke-width:0.5;" width="190" x="175" y="484"/><text fill="#000000" font-family="Arial" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="151" x="185" y="505.2559">5. Pengumpulan Dokumen,</text><text fill="#000000" font-family="Arial" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="170" x="185" y="519.0547">BAST, dan Pembayaran Honor</text></g><!--entity L6--><g id="elem_L6"><rect fill="#F1F1F1" height="47.5977" rx="5" ry="5" style="stroke:#555555;stroke-width:0.5;" width="160" x="196" y="598.5"/><text fill="#000000" font-family="Arial" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="140" x="206" y="619.7559">6. Penilaian Kinerja Mitra</text><text fill="#000000" font-family="Arial" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="131" x="206" y="633.5547">dan Peringkat Triwulan</text></g><g id="elem_GMN14"><path d="M397.5,158.5 L397.5,167 L353.31,171 L397.5,175 L397.5,183.7979 A5,5 0 0 0 402.5,188.7979 L559.5,188.7979 A5,5 0 0 0 564.5,183.7979 L564.5,163.5 L554.5,153.5 L402.5,153.5 A5,5 0 0 0 397.5,158.5 " fill="#FFFDE7" style="stroke:#B8A200;stroke-width:0.5;"/><path d="M554.5,153.5 L554.5,161 A2.5,2.5 0 0 0 557,163.5 L564.5,163.5 L554.5,153.5 " fill="#FFFDE7" style="stroke:#B8A200;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="146" x="403.5" y="168.8179">Alokasi mitra oleh tim lain pada</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="145" x="403.5" y="181.4668">bulan yang sama tidak terlihat.</text></g><g id="elem_GMN17"><path d="M397,260 L397,275 L358.37,279 L397,283 L397,297.9468 A5,5 0 0 0 402,302.9468 L592,302.9468 A5,5 0 0 0 597,297.9468 L597,265 L587,255 L402,255 A5,5 0 0 0 397,260 " fill="#FFFDE7" style="stroke:#B8A200;stroke-width:0.5;"/><path d="M587,255 L587,262.5 A2.5,2.5 0 0 0 589.5,265 L597,265 L587,255 " fill="#FFFDE7" style="stroke:#B8A200;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="179" x="403" y="270.3179">Batas honor SBML dicek manual satu</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="165" x="403" y="282.9668">per satu di awal bulan; SPK diketik</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="131" x="403" y="295.6157">dan dinomori satu per satu.</text></g><g id="elem_GMN20"><path d="M399.5,368 L399.5,389.5 L364.27,393.5 L399.5,397.5 L399.5,418.5957 A5,5 0 0 0 404.5,423.5957 L613.5,423.5957 A5,5 0 0 0 618.5,418.5957 L618.5,373 L608.5,363 L404.5,363 A5,5 0 0 0 399.5,368 " fill="#FFFDE7" style="stroke:#B8A200;stroke-width:0.5;"/><path d="M608.5,363 L608.5,370.5 A2.5,2.5 0 0 0 611,373 L618.5,373 L608.5,363 " fill="#FFFDE7" style="stroke:#B8A200;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="196" x="405.5" y="378.3179">Progres FASIH dan Non-FASIH setiap tim</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="198" x="405.5" y="390.9668">tersimpan di tempat berbeda; Kepala BPS</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="159" x="405.5" y="403.6157">tidak dapat memantau seluruh tim</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="97" x="405.5" y="416.2646">dalam satu tampilan.</text></g><g id="elem_GMN23"><path d="M400,489 L400,504 L365.36,508 L400,512 L400,526.9468 A5,5 0 0 0 405,531.9468 L585,531.9468 A5,5 0 0 0 590,526.9468 L590,494 L580,484 L405,484 A5,5 0 0 0 400,489 " fill="#FFFDE7" style="stroke:#B8A200;stroke-width:0.5;"/><path d="M580,484 L580,491.5 A2.5,2.5 0 0 0 582.5,494 L590,494 L580,484 " fill="#FFFDE7" style="stroke:#B8A200;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="169" x="406" y="499.3179">Tautan dokumen tersebar dan tidak</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="164" x="406" y="511.9668">terkumpul per kegiatan; penagihan</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="160" x="406" y="524.6157">dokumen dilakukan satu per satu.</text></g><g id="elem_GMN26"><path d="M397,597 L397,618.5 L356.34,622.5 L397,626.5 L397,647.5957 A5,5 0 0 0 402,652.5957 L602,652.5957 A5,5 0 0 0 607,647.5957 L607,602 L597,592 L402,592 A5,5 0 0 0 397,597 " fill="#FFFDE7" style="stroke:#B8A200;stroke-width:0.5;"/><path d="M597,592 L597,599.5 A2.5,2.5 0 0 0 599.5,602 L607,602 L597,592 " fill="#FFFDE7" style="stroke:#B8A200;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="162" x="403" y="607.3179">Penilaian disimpan di spreadsheet</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="189" x="403" y="619.9668">yang dapat diubah siapa pun; peringkat</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="163" x="403" y="632.6157">untuk evaluasi dan apresiasi mitra</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="77" x="403" y="645.2646">dihitung manual.</text></g><!--link L1 to L2--><g id="link_L1_L2"><path d="M284.65,87 C285.15,104.66 285.671,122.9424 286.171,140.6824 " fill="none" id="L1-to-L2" style="stroke:#333333;stroke-width:1.1;"/><polygon fill="#333333" points="286.34,146.68,290.0848,137.5709,286.1991,141.682,282.088,137.7963,286.34,146.68" style="stroke:#333333;stroke-width:1.1;"/></g><!--link L2 to L3--><g id="link_L2_L3"><path d="M287,195 C287,212.66 287,230.94 287,248.68 " fill="none" id="L2-to-L3" style="stroke:#333333;stroke-width:1.1;"/><polygon fill="#333333" points="287,254.68,291,245.68,287,249.68,283,245.68,287,254.68" style="stroke:#333333;stroke-width:1.1;"/></g><!--link L3 to L4--><g id="link_L3_L4"><path d="M285.77,303.04 C284.74,322.45 283.5781,344.0984 282.5481,363.4984 " fill="none" id="L3-to-L4" style="stroke:#333333;stroke-width:1.1;"/><polygon fill="#333333" points="282.23,369.49,286.7015,360.7147,282.4951,364.497,278.7128,360.2906,282.23,369.49" style="stroke:#333333;stroke-width:1.1;"/></g><!--link L4 to L5--><g id="link_L4_L5"><path d="M278.75,417.54 C276.85,436.95 274.7348,458.6186 272.8348,478.0186 " fill="none" id="L4-to-L5" style="stroke:#333333;stroke-width:1.1;"/><polygon fill="#333333" points="272.25,483.99,277.1082,475.4227,272.7374,479.0138,269.1463,474.643,272.25,483.99" style="stroke:#333333;stroke-width:1.1;"/></g><!--link L5 to L6--><g id="link_L5_L6"><path d="M271.23,532.04 C272.26,551.45 273.4219,573.0984 274.4519,592.4984 " fill="none" id="L5-to-L6" style="stroke:#333333;stroke-width:1.1;"/><polygon fill="#333333" points="274.77,598.49,278.2872,589.2906,274.5049,593.497,270.2985,589.7147,274.77,598.49" style="stroke:#333333;stroke-width:1.1;"/></g><!--SRC=[ZLJ1QXin4BtlLqnpIGk9mKxiGmC5cv8cn2s63Jq5ogmrtLMbbHQjLEEM_djdjEiufX1wikHzy-RDp1kTmuPSNQEB6Zv