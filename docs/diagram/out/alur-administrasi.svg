<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="529px" preserveAspectRatio="none" style="width:614px;height:529px;background:#FFFFFF;" version="1.1" viewBox="0 0 614 529" width="614px" zoomAndPan="magnify"><defs/><g><!--cluster Pengelolaan Mitra Statistik di BPS Kabupaten Bengkulu Selatan--><g id="cluster_Pengelolaan Mitra Statistik di BPS Kabupaten Bengkulu Selatan"><rect fill="none" height="519.5" rx="5" ry="5" style="stroke:#777777;stroke-width:1.0;" width="374" x="234.5" y="4"/><text fill="#000000" font-family="Arial" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="358" x="242.5" y="17.2559">Pengelolaan Mitra Statistik di BPS Kabupaten Bengkulu Selatan</text></g><g id="elem_GMN14"><path d="M59,123.5 L59,148.7979 A5,5 0 0 0 64,153.7979 L221,153.7979 A5,5 0 0 0 226,148.7979 L226,140 L253.1412,136 L226,132 L226,128.5 L216,118.5 L64,118.5 A5,5 0 0 0 59,123.5 " fill="#FFFDE7" style="stroke:#B8A200;stroke-width:0.5;"/><path d="M216,118.5 L216,126 A2.5,2.5 0 0 0 218.5,128.5 L226,128.5 L216,118.5 " fill="#FFFDE7" style="stroke:#B8A200;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="146" x="65" y="133.8179">Alokasi mitra oleh tim lain pada</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="145" x="65" y="146.4668">bulan yang sama tidak terlihat.</text></g><g id="elem_GMN17"><path d="M26.5,201 L26.5,238.9468 A5,5 0 0 0 31.5,243.9468 L221.5,243.9468 A5,5 0 0 0 226.5,238.9468 L226.5,224 L248.141,220 L226.5,216 L226.5,206 L216.5,196 L31.5,196 A5,5 0 0 0 26.5,201 " fill="#FFFDE7" style="stroke:#B8A200;stroke-width:0.5;"/><path d="M216.5,196 L216.5,203.5 A2.5,2.5 0 0 0 219,206 L226.5,206 L216.5,196 " fill="#FFFDE7" style="stroke:#B8A200;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="179" x="32.5" y="211.3179">Batas honor SBML dicek manual satu</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="165" x="32.5" y="223.9668">per satu di awal bulan; SPK diketik</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="131" x="32.5" y="236.6157">dan dinomori satu per satu.</text></g><g id="elem_GMN20"><path d="M6,285 L6,335.5957 A5,5 0 0 0 11,340.5957 L220,340.5957 A5,5 0 0 0 225,335.5957 L225,314.5 L243.3376,310.5 L225,306.5 L225,290 L215,280 L11,280 A5,5 0 0 0 6,285 " fill="#FFFDE7" style="stroke:#B8A200;stroke-width:0.5;"/><path d="M215,280 L215,287.5 A2.5,2.5 0 0 0 217.5,290 L225,290 L215,280 " fill="#FFFDE7" style="stroke:#B8A200;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="196" x="12" y="295.3179">Progres FASIH dan Non-FASIH setiap tim</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="198" x="12" y="307.9668">tersimpan di tempat berbeda; Kepala BPS</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="159" x="12" y="320.6157">tidak dapat memantau seluruh tim</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="97" x="12" y="333.2646">dalam satu tampilan.</text></g><g id="elem_GMN23"><path d="M34.5,382 L34.5,419.9468 A5,5 0 0 0 39.5,424.9468 L219.5,424.9468 A5,5 0 0 0 224.5,419.9468 L224.5,405 L242.209,401 L224.5,397 L224.5,387 L214.5,377 L39.5,377 A5,5 0 0 0 34.5,382 " fill="#FFFDE7" style="stroke:#B8A200;stroke-width:0.5;"/><path d="M214.5,377 L214.5,384.5 A2.5,2.5 0 0 0 217,387 L224.5,387 L214.5,377 " fill="#FFFDE7" style="stroke:#B8A200;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="169" x="40.5" y="392.3179">Tautan dokumen tersebar dan tidak</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="164" x="40.5" y="404.9668">terkumpul per kegiatan; penagihan</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="160" x="40.5" y="417.6157">dokumen dilakukan satu per satu.</text></g><g id="elem_GMN26"><path d="M16.5,466 L16.5,516.5957 A5,5 0 0 0 21.5,521.5957 L221.5,521.5957 A5,5 0 0 0 226.5,516.5957 L226.5,495.5 L250.3072,491.5 L226.5,487.5 L226.5,471 L216.5,461 L21.5,461 A5,5 0 0 0 16.5,466 " fill="#FFFDE7" style="stroke:#B8A200;stroke-width:0.5;"/><path d="M216.5,461 L216.5,468.5 A2.5,2.5 0 0 0 219,471 L226.5,471 L216.5,461 " fill="#FFFDE7" style="stroke:#B8A200;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="162" x="22.5" y="476.3179">Penilaian disimpan di spreadsheet</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="189" x="22.5" y="488.9668">yang dapat diubah siapa pun; peringkat</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="163" x="22.5" y="501.6157">untuk evaluasi dan apresiasi mitra</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="77" x="22.5" y="514.2646">dihitung manual.</text></g><!--entity L1--><g id="elem_L1"><rect fill="#F1F1F1" height="47.5977" rx="5" ry="5" style="stroke:#555555;stroke-width:0.5;" width="162" x="242.5" y="28"/><text fill="#000000" font-family="Arial" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="142" x="252.5" y="49.2559">1. Perencanaan Kegiatan</text><text fill="#000000" font-family="Arial" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="117" x="252.5" y="63.0547">dan Kebutuhan Mitra</text></g><!--entity L2--><g id="elem_L2"><rect fill="#F1F1F1" height="47.5977" rx="5" ry="5" style="stroke:#555555;stroke-width:0.5;" width="132" x="253.5" y="112"/><text fill="#000000" font-famil