<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="1122px" preserveAspectRatio="none" style="width:805px;height:1122px;background:#FFFFFF;" version="1.1" viewBox="0 0 805 1122" width="805px" zoomAndPan="magnify"><defs/><g><rect fill="none" height="14.9487" style="stroke:none;stroke-width:1.0;" width="772.25" x="15" y="11.2549"/><ellipse cx="161" cy="41.2036" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#EEF4FB" height="47.5977" rx="5" ry="5" style="stroke:#2F4F75;stroke-width:0.5;" width="228" x="47" y="71.2036"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="141" x="57" y="92.4595">Membuka fitur Impor Mitra</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="208" x="57" y="106.2583">dan memilih berkas Excel dari SOBAT</text><rect fill="#EEF4FB" height="47.5977" rx="5" ry="5" style="stroke:#2F4F75;stroke-width:0.5;" width="208" x="57" y="317.9966"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="188" x="67" y="339.2524">Menentukan tindakan setiap baris:</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="138" x="67" y="353.0513">tambah / perbarui / lewati</text><rect fill="#EEF4FB" height="47.5977" rx="5" ry="5" style="stroke:#2F4F75;stroke-width:0.5;" width="230" x="46" y="385.5942"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="210" x="56" y="406.8501">Memilih mitra yang tidak ada di berkas</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="106" x="56" y="420.6489">untuk dinonaktifkan</text><polygon fill="#FFF6D9" points="161,273.9966,173,285.9966,161,297.9966,149,285.9966,161,273.9966" style="stroke:#8A6D00;stroke-width:0.5;"/><polygon fill="#FFF6D9" points="100,520.7896,222,520.7896,234,532.7896,222,544.7896,100,544.7896,88,532.7896,100,520.7896" style="stroke:#8A6D00;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="26" x="165" y="556.0454">tidak</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="122" x="100" y="536.783">Ringkasan belum sesuai?</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="107" x="234" y="530.2466">ya, ubah keputusan</text><rect fill="#EEF4FB" height="33.7988" rx="5" ry="5" style="stroke:#2F4F75;stroke-width:0.5;" width="113" x="104.5" y="577.5454"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="93" x="114.5" y="598.8013">Menyetujui impor</text><line style="stroke:#555555;stroke-width:1.0;" x1="15" x2="15" y1="11.2549" y2="1110.1294"/><rect fill="#EEF4FB" height="47.5977" rx="5" ry="5" style="stroke:#2F4F75;stroke-width:0.5;" width="188" x="459.25" y="138.8013"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="168" x="469.25" y="160.0571">Membaca berkas di peramban</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="146" x="469.25" y="173.856">dan memetakan kolomnya</text><rect fill="#EEF4FB" height="47.5977" rx="5" ry="5" style="stroke:#2F4F75;stroke-width:0.5;" width="292" x="407.25" y="206.3989"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="272" x="417.25" y="227.6548">Mencocokkan setiap baris dengan mitra yang ada</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="188" x="417.25" y="241.4536">berdasarkan ID SOBAT, lalu nama</text><rect fill="#EEF4FB" height="47.5977" rx="5" ry="5" style="stroke:#2F4F75;stroke-width:0.5;" width="193" x="456.75" y="453.1919"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="173" x="466.75" y="474.4478">Menghitung ringkasan pratinjau</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="149" x="466.75" y="488.2466">tanpa mengubah database</text><rect fill="#EEF4FB" height="33.7988" rx="5" ry="5" style="stroke:#2F4F75;stroke-width:0.5;" width="148" x="479.25" y="631.3442"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="128" x="489.25" y="652.6001">Memulai satu transaksi</text><rect fill="#EEF4FB" height="47.5977" rx="5" ry="5" style="stroke:#2F4F75;stroke-width:0.5;" width="252" x="427.25" y="685.1431"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="232" x="437.25" y="706.3989">Menambah mitra baru dengan ID otomatis</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="215" x="437.25" y="720.1978">dan mencocokkan kecamatan/desanya</text><rect fill="#EEF4FB" height="47.5977" rx="5" ry="5" style="stroke:#2F4F75;stroke-width:0.5;" width="216" x="445.25" y="752.7407"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="196" x="455.25" y="773.9966">Memperbarui data mitra yang dipilih</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="169" x="455.25" y="787.7954">dan menyimpan ID SOBAT-nya</text><rect fill="#EEF4FB" height="47.5977" rx="5" ry="5" style="stroke:#2F4F75;stroke-width:0.5;" width="195" x="455.75" y="820.3384"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="175" x="465.75" y="841.5942">Menonaktifkan mitra yang dipilih</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="161" x="465.75" y="855.3931">tanpa menghapus riwayatnya</text><polygon fill="#FFF6D9" points="521.25,887.936,585.25,887.936,597.25,899.936,585.25,911.936,521.25,911.936,509.25,899.