</text><ellipse cx="554.5" cy="467.1948" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="554.5" cy="467.1948" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><polygon fill="#FFF6D9" points="523,337.9966,586,337.9966,598,349.9966,586,361.9966,523,361.9966,511,349.9966,523,337.9966" style="stroke:#8A6D00;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="26" x="558.5" y="373.2524">tidak</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="63" x="523" y="353.99">Periode sah?</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="12" x="598" y="347.4536">ya</text><rect fill="#EEF4FB" height="61.3965" rx="5" ry="5" style="stroke:#2F4F75;stroke-width:0.5;" width="204" x="452.5" y="520.1948"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="184" x="462.5" y="541.4507">Menjumlahkan honor setiap mitra</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="145" x="462.5" y="555.2495">pada periode tersebut dari</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="181" x="462.5" y="569.0483">seluruh kegiatan dan seluruh tim</text><rect fill="#EEF4FB" height="47.5977" rx="5" ry="5" style="stroke:#2F4F75;stroke-width:0.5;" width="238" x="435.5" y="601.5913"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="218" x="445.5" y="622.8472">Membandingkan honor puncak bulanan</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="165" x="445.5" y="636.646">tiap mitra dengan batas SBML</text><rect fill="#EEF4FB" height="47.5977" rx="5" ry="5" style="stroke:#2F4F75;stroke-width:0.5;" width="214" x="447.5" y="669.189"/><text fill="#000000" font-family="Arial" font-size="12" lengthAd